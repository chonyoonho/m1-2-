<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.8민주의거기념사업회 데이터 비서</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">3·8</span>
      <div>
        <h1>3.8민주의거기념사업회 데이터 비서</h1>
        <p>자유 · 민주 · 정의 — 교육·행사 프로그램 데이터를 이해하는 AI</p>
      </div>
    </div>
    <div class="summary-badge" id="summary-badge">
      <span class="dot"></span>
      <span id="summary-badge-text">요약 정보 불러오는 중...</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="chat">AI 채팅</button>
    <button class="tab-btn" data-tab="data">데이터 관리</button>
    <button class="tab-btn" data-tab="history">대화 기록</button>
  </nav>

  <main>
    <!-- 채팅 탭 -->
    <section id="tab-chat" class="tab-panel active">
      <aside class="summary-card" id="summary-card">
        <h2>데이터 요약</h2>
        <dl id="summary-list">
          <dt>기간</dt><dd id="s-period">-</dd>
          <dt>레코드 수</dt><dd id="s-count">-</dd>
          <dt>참가자 수 (평균/최대/최소)</dt><dd id="s-metrics">-</dd>
          <dt>최근 추세</dt><dd id="s-trend">-</dd>
        </dl>
      </aside>

      <div class="chat-panel">
        <div class="chat-toolbar">
          <span id="current-conversation-label">새 대화</span>
          <button id="new-chat-btn" class="btn-ghost">+ 새 대화</button>
        </div>
        <div id="chat-messages" class="chat-messages">
          <div class="chat-empty">3.8민주의거기념사업회의 교육·행사 프로그램 참가자 수에 대해 무엇이든 물어보세요.</div>
        </div>
        <form id="chat-form" class="chat-input-row">
          <input id="chat-input" type="text" placeholder="예) 이번 달 프로그램 참가자 수 어때?" autocomplete="off" required />
          <button type="submit" id="chat-send-btn">전송</button>
        </form>
      </div>
    </section>

    <!-- 데이터 관리 탭 -->
    <section id="tab-data" class="tab-panel">
      <div class="panel-box">
        <h2>참가자 수 데이터 추가</h2>
        <form id="data-form" class="data-form">
          <input type="hidden" id="data-id" />
          <label>날짜 <input type="date" id="data-date" required /></label>
          <label>참가자 수 <input type="number" id="data-value" min="0" step="1" required /></label>
          <label class="grow">프로그램/행사명 <input type="text" id="data-memo" maxlength="200" required /></label>
          <button type="submit" id="data-submit-btn">추가</button>
          <button type="button" id="data-cancel-btn" class="btn-ghost hidden">수정 취소</button>
        </form>
        <p id="data-status" class="status-text"></p>
      </div>

      <div class="panel-box">
        <div class="panel-box-header">
          <h2>데이터 목록</h2>
          <button id="data-refresh-btn" class="btn-ghost">새로고침</button>
        </div>
        <div class="table-wrap">
          <table id="data-table">
            <thead>
              <tr><th>날짜</th><th>참가자 수</th><th>프로그램/행사명</th><th></th></tr>
            </thead>
            <tbody id="data-table-body">
              <tr><td colspan="4" class="muted">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 대화 기록 탭 -->
    <section id="tab-history" class="tab-panel">
      <div class="panel-box">
        <div class="panel-box-header">
          <h2>저장된 대화 목록</h2>
          <button id="history-refresh-btn" class="btn-ghost">새로고침</button>
        </div>
        <ul id="conversation-list" class="conversation-list">
          <li class="muted">불러오는 중...</li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>대전광역시 3.8민주의거기념사업회 · 데이터 기반 AI 비서 데모</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/data.js"></script>
  <script src="js/conversations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
